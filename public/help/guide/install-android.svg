<svg viewBox="0 0 860 372" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Cài đặt trên Android bằng Chrome — 3 bước">
  <defs>
    <linearGradient id="aTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2748"/><stop offset="1" stop-color="#0a1c34"/>
    </linearGradient>
    <linearGradient id="aLeg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- nền -->
  <rect x="0" y="0" width="860" height="372" rx="18" fill="#0b1424"/>
  <text x="28" y="36" font-size="17" font-weight="700" fill="#e2e8f0">Cài trên Android <tspan fill="#818cf8">(Chrome)</tspan></text>
  <rect x="28" y="48" width="46" height="3" rx="1.5" fill="#6366f1"/>

  <!-- ===== PHONE 1 ===== -->
  <g transform="translate(40,66)">
    <rect width="200" height="252" rx="26" fill="#16243d" stroke="#38496b" stroke-width="1.5"/>
    <rect x="12" y="14" width="176" height="224" rx="16" fill="#0a1424"/>
    <rect x="78" y="20" width="44" height="6" rx="3" fill="#38496b"/>
    <!-- thanh địa chỉ Chrome -->
    <rect x="24" y="40" width="132" height="24" rx="12" fill="#16233c"/>
    <circle cx="36" cy="52" r="3.5" fill="#94a3b8"/>
    <text x="46" y="56" font-size="8.5" fill="#cbd5e1">assetflow.fadoai.com</text>
    <!-- nút ⋮ được tô sáng -->
    <circle cx="172" cy="52" r="13" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="2"/>
    <circle cx="172" cy="46.5" r="1.7" fill="#e2e8f0"/>
    <circle cx="172" cy="52" r="1.7" fill="#e2e8f0"/>
    <circle cx="172" cy="57.5" r="1.7" fill="#e2e8f0"/>
    <!-- nội dung trang mờ -->
    <rect x="28" y="80" width="90" height="9" rx="4" fill="#1e2c46"/>
    <rect x="28" y="98" width="144" height="7" rx="3" fill="#15233c"/>
    <rect x="28" y="112" width="120" height="7" rx="3" fill="#15233c"/>
    <rect x="28" y="138" width="66" height="40" rx="8" fill="#13213a"/>
    <rect x="104" y="138" width="66" height="40" rx="8" fill="#13213a"/>
    <rect x="28" y="190" width="142" height="34" rx="8" fill="#13213a"/>
    <!-- badge bước -->
    <circle cx="26" cy="20" r="15" fill="#6366f1"/>
    <text x="26" y="25" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  </g>
  <text x="140" y="340" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="600">Mở Chrome → nhấn <tspan fill="#a5b4fc">⋮</tspan></text>

  <!-- mũi tên -->
  <path d="M256 192 l16 0 m-6 -6 l6 6 -6 6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== PHONE 2 ===== -->
  <g transform="translate(330,66)">
    <rect width="200" height="252" rx="26" fill="#16243d" stroke="#38496b" stroke-width="1.5"/>
    <rect x="12" y="14" width="176" height="224" rx="16" fill="#0a1424"/>
    <rect x="78" y="20" width="44" height="6" rx="3" fill="#38496b"/>
    <!-- menu xổ xuống -->
    <rect x="44" y="40" width="132" height="180" rx="12" fill="#16233c" stroke="#2a3a57"/>
    <rect x="56" y="56" width="80" height="7" rx="3" fill="#2a3a57"/>
    <rect x="56" y="74" width="96" height="7" rx="3" fill="#2a3a57"/>
    <!-- dòng được tô sáng -->
    <rect x="50" y="92" width="120" height="30" rx="8" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="58" y="101" width="13" height="13" rx="3" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
    <path d="M64.5 104 v7 M61 107.5 h7" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round"/>
    <text x="78" y="111.5" font-size="9" font-weight="600" fill="#e2e8f0">Thêm vào Màn hình chính</text>
    <rect x="56" y="134" width="100" height="7" rx="3" fill="#2a3a57"/>
    <rect x="56" y="152" width="72" height="7" rx="3" fill="#2a3a57"/>
    <rect x="56" y="170" width="88" height="7" rx="3" fill="#2a3a57"/>
    <rect x="56" y="188" width="64" height="7" rx="3" fill="#2a3a57"/>
    <circle cx="26" cy="20" r="15" fill="#6366f1"/>
    <text x="26" y="25" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  </g>
  <text x="430" y="340" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="600">Chọn “Thêm vào Màn hình chính”</text>

  <path d="M546 192 l16 0 m-6 -6 l6 6 -6 6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== PHONE 3 ===== -->
  <g transform="translate(620,66)">
    <rect width="200" height="252" rx="26" fill="#16243d" stroke="#38496b" stroke-width="1.5"/>
    <rect x="12" y="14" width="176" height="224" rx="16" fill="#0a1424"/>
    <rect x="78" y="20" width="44" height="6" rx="3" fill="#38496b"/>
    <!-- lưới biểu tượng -->
    <g fill="#1c2c48">
      <rect x="34" y="46" width="36" height="36" rx="9"/><rect x="82" y="46" width="36" height="36" rx="9"/><rect x="130" y="46" width="36" height="36" rx="9"/>
      <rect x="82" y="98" width="36" height="36" rx="9"/><rect x="130" y="98" width="36" height="36" rx="9"/>
    </g>
    <!-- icon AssetFlow nổi bật -->
    <g transform="translate(34,98)">
      <rect x="-4" y="-4" width="44" height="44" rx="12" fill="#6366f1" fill-opacity="0.18"/>
      <rect width="36" height="36" rx="9" fill="url(#aTile)" stroke="#818cf8" stroke-opacity="0.6"/>
      <g transform="translate(6,6) scale(0.5)">
        <path d="M10 40 L24 8 L38 40" fill="none" stroke="url(#aLeg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 27 H31.5" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <text x="52" y="150" font-size="8" fill="#cbd5e1" text-anchor="middle">AssetFlow</text>
    <rect x="60" y="206" width="80" height="6" rx="3" fill="#1c2c48"/>
    <circle cx="26" cy="20" r="15" fill="#10b981"/>
    <path d="M19 20 l5 5 9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="720" y="340" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="600">Mở app từ màn hình chính</text>
</svg>
